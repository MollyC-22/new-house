<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏡 新家裝潢小幫手</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FFFDF7',
                        sakura: '#FFB7B2',
                        mint: '#E2F0CB',
                        babyblue: '#B5EAD7',
                        textMain: '#5C4D4D',
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FFFDF7; color: #5C4D4D; }
        ::-webkit-scrollbar { display: none; }
        .app-container { padding-bottom: 80px; }
        .btn-press:active { transform: scale(0.95); transition: all 0.1s; }
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body class="antialiased selection:bg-sakura selection:text-white">

    <div class="max-w-md mx-auto min-h-screen relative app-container shadow-sm bg-paper">
        
        <header class="p-5 text-center sticky top-0 bg-paper/90 backdrop-blur-sm z-10">
            <h1 class="text-xl font-bold text-textMain"><i class="fa-solid fa-house-chimney text-sakura mr-2"></i>我們的裝潢日記</h1>
        </header>

        <main id="page-home" class="page-section active px-5 space-y-6">
            
            <section class="bg-white p-5 rounded-3xl shadow-[0_4px_15px_rgba(255,183,178,0.2)] border-2 border-sakura/20">
                <p class="text-sm text-center mb-1">目前總花費</p>
                <h2 class="text-4xl font-bold text-center text-sakura mb-4">$<span id="total-amount">0</span></h2>
                
                <div class="flex justify-between items-center text-sm bg-paper p-3 rounded-2xl">
                    <div class="text-center w-1/2 border-r border-sakura/30">
                        <p class="mb-1">🙋‍♀️ 芝芝已付</p>
                        <p class="font-bold text-textMain" id="chichi-paid">$0</p>
                    </div>
                    <div class="text-center w-1/2">
                        <p class="mb-1">🙋‍♂️ 小T已付</p>
                        <p class="font-bold text-textMain" id="littlet-paid">$0</p>
                    </div>
                </div>
            </section>

            <section class="bg-white p-5 rounded-3xl shadow-sm border-2 border-mint/30">
                <h3 class="font-bold mb-4"><i class="fa-solid fa-pen text-mint mr-2"></i>記一筆</h3>
                
                <form id="expense-form" class="space-y-4">
                    <div>
                        <input type="number" id="amount" placeholder="輸入金額..." required
                               class="w-full text-2xl p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-center font-bold">
                    </div>
                    
                    <div>
                        <input type="text" id="item-name" placeholder="例如：裝潢第一期、大金冷氣..." required
                               class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="category" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="設計師裝潢費用">📐 設計師裝潢費用</option>
                            <option value="家電">📺 家電</option>
                            <option value="軟裝">🪴 軟裝</option>
                            <option value="裝飾類">🖼️ 裝飾類</option>
                            <option value="其他">🏷️ 其他</option>
                        </select>
                        <select id="area" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="不分區">🏠 不分區/全室</option>
                            <option value="玄關">🚪 玄關</option>
                            <option value="客廳">🛋️ 客廳</option>
                            <option value="主臥">🛏️ 主臥</option>
                            <option value="更衣室">👗 更衣室</option>
                            <option value="次臥">🧸 次臥</option>
                            <option value="衛浴">🛁 衛浴</option>
                            <option value="廚房餐廳">🍽️ 廚房餐廳</option>
                            <option value="陽台">🌿 陽台</option>
                        </select>
                    </div>

                    <div>
                        <select id="payment-method" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="轉帳">🏦 轉帳</option>
                            <option value="刷卡">💳 刷卡</option>
                            <option value="現金">💵 現金</option>
                        </select>
                    </div>

                    <div class="flex gap-2">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="芝芝" class="peer hidden" checked>
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-sakura peer-checked:text-white transition font-bold btn-press">
                                🙋‍♀️ 芝芝
                            </div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="小T" class="peer hidden">
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-babyblue peer-checked:text-textMain transition font-bold btn-press">
                                🙋‍♂️ 小T
                            </div>
                        </label>
                    </div>

                    <div>
                        <input type="text" id="notes" placeholder="新增備註 (選填)..."
                               class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm">
                    </div>

                    <div class="flex gap-2">
                        <label class="flex-1 p-3 border-2 border-dashed border-mint text-mint rounded-2xl font-bold flex justify-center items-center gap-2 cursor-pointer btn-press text-sm text-center">
                            <input type="file" id="photo-upload" accept="image/*" class="hidden">
