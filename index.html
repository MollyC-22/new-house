<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏡 新家裝潢小幫手</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FFFDF7',
                        sakura: '#FFB7B2',
                        mint: '#E2F0CB',
                        babyblue: '#B5EAD7',
                        textMain: '#5C4D4D',
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FFFDF7; color: #5C4D4D; }
        ::-webkit-scrollbar { display: none; }
        .app-container { padding-bottom: 80px; }
        .btn-press:active { transform: scale(0.95); transition: all 0.1s; }
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body class="antialiased selection:bg-sakura selection:text-white">

    <div class="max-w-md mx-auto min-h-screen relative app-container shadow-sm bg-paper">
        
        <header class="p-5 text-center sticky top-0 bg-paper/90 backdrop-blur-sm z-10">
            <h1 class="text-xl font-bold text-textMain"><i class="fa-solid fa-house-chimney text-sakura mr-2"></i>我們的裝潢日記</h1>
        </header>

        <main id="page-home" class="page-section active px-5 space-y-6">
            
            <section class="bg-white p-5 rounded-3xl shadow-[0_4px_15px_rgba(255,183,178,0.2)] border-2 border-sakura/20">
                <p class="text-sm text-center mb-1">目前總花費</p>
                <h2 class="text-4xl font-bold text-center text-sakura mb-4">$<span id="total-amount">0</span></h2>
                
                <div class="flex justify-between items-center text-sm bg-paper p-3 rounded-2xl">
                    <div class="text-center w-1/2 border-r border-sakura/30">
                        <p class="mb-1">🙋‍♀️ 芝芝已付</p>
                        <p class="font-bold text-textMain" id="chichi-paid">$0</p>
                    </div>
                    <div class="text-center w-1/2">
                        <p class="mb-1">🙋‍♂️ 小T已付</p>
                        <p class="font-bold text-textMain" id="littlet-paid">$0</p>
                    </div>
                </div>
            </section>

            <section class="bg-white p-5 rounded-3xl shadow-sm border-2 border-mint/30">
                <h3 class="font-bold mb-4"><i class="fa-solid fa-pen text-mint mr-2"></i>記一筆</h3>
                
                <form id="expense-form" class="space-y-4">
                    <div>
                        <input type="number" id="amount" placeholder="輸入金額..." required
                               class="w-full text-2xl p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-center font-bold">
                    </div>
                    
                    <div>
                        <input type="text" id="item-name" placeholder="例如：報價單第一期、TOTO馬桶..." required
                               class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="category" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="系統櫃">🗄️ 系統櫃</option>
                            <option value="木作">🪚 木作</option>
                            <option value="水電">⚡ 水電</option>
                            <option value="玻璃">🪟 玻璃</option>
                            <option value="油漆">🖌️ 油漆</option>
                            <option value="泥作">🧱 泥作</option>
                            <option value="家電">📺 家電</option>
                            <option value="軟裝">🪴 軟裝 (窗簾/傢俱)</option>
                            <option value="其他">🏷️ 其他</option>
                        </select>
                        <select id="area" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="不分區">🏠 不分區/全室</option>
                            <option value="玄關">🚪 玄關</option>
                            <option value="客廳">🛋️ 客廳</option>
                            <option value="主臥">🛏️ 主臥</option>
                            <option value="更衣室">👗 更衣室</option>
                            <option value="次臥">🧸 次臥</option>
                            <option value="衛浴">🛁 衛浴</option>
                            <option value="廚房餐廳">🍽️ 廚房餐廳</option>
                            <option value="陽台">🌿 陽台</option>
                        </select>
                    </div>

                    <div>
                        <select id="payment-method" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="轉帳">🏦 轉帳</option>
                            <option value="刷卡">💳 刷卡</option>
                            <option value="現金">💵 現金</option>
                        </select>
                    </div>

                    <div class="flex gap-2">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="芝芝" class="peer hidden" checked>
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-sakura peer-checked:text-white transition font-bold btn-press">
                                🙋‍♀️ 芝芝
                            </div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="小T" class="peer hidden">
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-babyblue peer-checked:text-textMain transition font-bold btn-press">
                                🙋‍♂️ 小T
                            </div>
                        </label>
                    </div>

                    <div>
                        <input type="text" id="notes" placeholder="新增備註 (選填)..."
                               class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm">
                    </div>

                    <button type="button" class="w-full p-3 border-2 border-dashed border-sakura text-sakura rounded-2xl font-bold flex justify-center items-center gap-2 btn-press" onclick="alert('照片上傳需要開啟 Firebase Storage 功能，我們之後再來擴充這個進階功能！')">
                        <i class="fa-solid fa-camera"></i> 拍單據照片 (開發中)
                    </button>

                    <button type="submit" class="w-full p-4 bg-sakura text-white rounded-2xl font-bold text-lg shadow-md btn-press">
                        儲存花費
                    </button>
                </form>
            </section>
        </main>

        <main id="page-list" class="page-section px-5 pb-10">
            <h3 class="font-bold mb-4 pl-2"><i class="fa-solid fa-list-ul text-sakura mr-2"></i>所有明細</h3>
            <div id="expense-list" class="space-y-3">
                </div>
        </main>

        <main id="page-chart" class="page-section px-5 pb-10 text-center pt-20">
            <i class="fa-solid fa-person-digging text-6xl text-mint mb-4"></i>
            <h3 class="font-bold text-xl mb-2 text-textMain">統計圖表施工中</h3>
            <p class="text-gray-400 text-sm">未來可以在這裡看各區域、各工種的花費圓餅圖喔！</p>
        </main>

        <main id="page-settings" class="page-section px-5 pb-10 text-center pt-20">
            <i class="fa-solid fa-gear text-6xl text-babyblue mb-4"></i>
            <h3 class="font-bold text-xl mb-2 text-textMain">設定頁施工中</h3>
            <p class="text-gray-400 text-sm">未來可以在這裡設定預算上限或匯出 Excel 表格！</p>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 pb-safe pt-2 px-2 flex justify-around items-center text-[10px] shadow-[0_-10px_20px_rgba(0,0,0,0.03)] rounded-t-3xl z-20">
            <button id="nav-home" class="nav-btn w-1/4 flex flex-col items-center p-2 text-sakura font-bold transition-colors">
                <i class="fa-solid fa-house text-lg mb-1"></i>首頁
            </button>
            <button id="nav-list" class="nav-btn w-1/4 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-list-check text-lg mb-1"></i>明細
            </button>
            <button id="nav-chart" class="nav-btn w-1/4 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-chart-pie text-lg mb-1"></i>統計
            </button>
            <button id="nav-settings" class="nav-btn w-1/4 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-gear text-lg mb-1"></i>設定
            </button>
        </nav>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 你的專屬金鑰
        const firebaseConfig = {
          apiKey: "AIzaSyDMlzCt1NyVtNnkmCT6i5dXy32nWl5mhWM",
          authDomain: "new-house-24ecb.firebaseapp.com",
          projectId: "new-house-24ecb",
          storageBucket: "new-house-24ecb.firebasestorage.app",
          messagingSenderId: "212198350832",
          appId: "1:212198350832:web:722951ad61a042802b8735",
          measurementId: "G-CRPMKV6RZG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 四個頁籤切換邏輯 ---
        const tabs = [
            { btn: document.getElementById('nav-home'), page: document.getElementById('page-home') },
            { btn: document.getElementById('nav-list'), page: document.getElementById('page-list') },
            { btn: document.getElementById('nav-chart'), page: document.getElementById('page-chart') },
            { btn: document.getElementById('nav-settings'), page: document.getElementById('page-settings') }
        ];

        tabs.forEach(tab => {
            tab.btn.addEventListener('click', () => {
                // 重置所有按鈕和頁面
                tabs.forEach(t => {
                    t.page.classList.remove('active');
                    t.btn.classList.remove('text-sakura', 'font-bold');
                    t.btn.classList.add('text-gray-400');
                });
                // 啟動點擊的按鈕和頁面
                tab.page.classList.add('active');
                tab.btn.classList.remove('text-gray-400');
                tab.btn.classList.add('text-sakura', 'font-bold');
                window.scrollTo(0, 0);
            });
        });

        // ------------------

        // DOM 元素
        const form = document.getElementById('expense-form');
        const listContainer = document.getElementById('expense-list');
        const totalEl = document.getElementById('total-amount');
        const chichiPaidEl = document.getElementById('chichi-paid');
        const littletPaidEl = document.getElementById('littlet-paid');

        const formatMoney = (num) => new Intl.NumberFormat('zh-TW').format(num);

        // 即時監聽資料庫
        const expensesRef = collection(db, "expenses");
        const q = query(expensesRef, orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            listContainer.innerHTML = '';
            let total = 0;
            let chichiTotal = 0;
            let littletTotal = 0;

            snapshot.forEach((doc) => {
                const exp = doc.data();
                
                total += exp.amount;
                if(exp.payer === '芝芝') chichiTotal += exp.amount;
                if(exp.payer === '小T') littletTotal += exp.amount;

                // 處理舊資料或空白資料
                const cat = exp.category || '未分類';
                const areaTag = exp.area && exp.area !== '不分區' ? `<span class="bg-babyblue/50 text-textMain px-2 py-0.5 rounded-full">${exp.area}</span>` : '';
                const pay = exp.paymentMethod || '無';
                const note = exp.notes ? `<p class="text-xs text-gray-500 mt-1 bg-gray-50 p-2 rounded-lg"><i class="fa-solid fa-comment-dots mr-1"></i>${exp.notes}</p>` : '';

                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-2xl shadow-sm border border-gray-50';
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 flex-shrink-0 rounded-full flex items-center justify-center font-bold text-sm ${exp.payer === '芝芝' ? 'bg-sakura text-white' : 'bg-babyblue text-textMain'}">
                                ${exp.payer === '芝芝' ? '芝' : 'T'}
                            </div>
                            <div>
                                <p class="font-bold text-textMain">${exp.name}</p>
                                <div class="text-xs text-gray-400 mt-1 flex flex-wrap gap-1 items-center">
                                    <span>${exp.date}</span>
                                    <span class="bg-mint/50 text-textMain px-2 py-0.5 rounded-full">${cat}</span>
                                    ${areaTag}
                                    <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">${pay}</span>
                                </div>
                            </div>
                        </div>
                        <div class="font-bold text-lg text-sakura">$${formatMoney(exp.amount)}</div>
                    </div>
                    ${note}
                `;
                listContainer.appendChild(item);
            });

            totalEl.innerText = formatMoney(total);
            chichiPaidEl.innerText = `$${formatMoney(chichiTotal)}`;
            littletPaidEl.innerText = `$${formatMoney(littletTotal)}`;
        });

        // 處理表單送出
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = parseInt(document.getElementById('amount').value);
            const name = document.getElementById('item-name').value;
            const payer = document.querySelector('input[name="payer"]:checked').value;
            const category = document.getElementById('category').value;
            const area = document.getElementById('area').value; // 新增抓取區域
            const paymentMethod = document.getElementById('payment-method').value;
            const notes = document.getElementById('notes').value;
            
            const today = new Date();
            const dateStr = `${today.getMonth()+1}/${today.getDate()}`;

            try {
                // 送出按鈕顯示載入中
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerText;
                submitBtn.innerText = '儲存中...';
                submitBtn.disabled = true;

                await addDoc(collection(db, "expenses"), {
                    amount: amount,
                    name: name,
                    payer: payer,
                    category: category,
                    area: area, // 存入資料庫
                    paymentMethod: paymentMethod,
                    notes: notes,
                    date: dateStr,
                    timestamp: new Date()
                });
                
                form.reset();
                document.querySelector('input[name="payer"][value="芝芝"]').checked = true;
                
                // 恢復按鈕狀態
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                
                // 自動切換到明細清單頁看結果 (模擬點擊清單按鈕)
                document.getElementById('nav-list').click();

            } catch (e) {
                console.error("加入文件時發生錯誤: ", e);
                alert("儲存失敗，請檢查網路狀態！");
                form.querySelector('button[type="submit"]').disabled = false;
            }
        });
    </script>
</body>
</html>
