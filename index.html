<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏡 新家裝潢小幫手</title>
    
    <!-- App Icon 與手機桌面圖示設定 -->
    <link rel="icon" type="image/png" href="new-home-icon.png">
    <link rel="apple-touch-icon" href="new-home-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="裝潢日記">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FFFDF7',
                        sakura: '#FFB7B2',
                        mint: '#E2F0CB',
                        babyblue: '#B5EAD7',
                        textMain: '#5C4D4D',
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FFFDF7; color: #5C4D4D; }
        ::-webkit-scrollbar { display: none; }
        .app-container { padding-bottom: 80px; }
        .btn-press:active { transform: scale(0.95); transition: all 0.1s; }
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body class="antialiased selection:bg-sakura selection:text-white">

    <div class="max-w-md mx-auto min-h-screen relative app-container shadow-sm bg-paper">
        
        <header class="p-5 text-center sticky top-0 bg-paper/90 backdrop-blur-sm z-10">
            <h1 class="text-xl font-bold text-textMain"><i class="fa-solid fa-house-chimney text-sakura mr-2"></i>我們的裝潢日記</h1>
        </header>

        <!-- ================= 1. 首頁區塊 (記帳) ================= -->
        <main id="page-home" class="page-section active px-5 space-y-6">
            
            <!-- 總花費 Dashboard -->
            <section class="bg-white p-5 rounded-3xl shadow-[0_4px_15px_rgba(255,183,178,0.2)] border-2 border-sakura/20">
                <p class="text-sm text-center mb-1">目前總花費</p>
                <h2 class="text-4xl font-bold text-center text-sakura mb-4">$<span id="total-amount">0</span></h2>
                
                <div class="flex justify-between items-center text-sm bg-paper p-3 rounded-2xl">
                    <div class="text-center w-1/2 border-r border-sakura/30">
                        <p class="mb-1">🙋‍♀️ 芝芝已付</p>
                        <p class="font-bold text-textMain" id="chichi-paid">$0</p>
                    </div>
                    <div class="text-center w-1/2">
                        <p class="mb-1">🙋‍♂️ 小T已付</p>
                        <p class="font-bold text-textMain" id="littlet-paid">$0</p>
                    </div>
                </div>
            </section>

            <!-- 記帳表單 -->
            <section class="bg-white p-5 rounded-3xl shadow-sm border-2 border-mint/30">
                <h3 class="font-bold mb-4"><i class="fa-solid fa-pen text-mint mr-2"></i>記一筆</h3>
                
                <form id="expense-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-textMain mb-1 font-bold pl-1">📅 選擇消費日期</label>
                        <input type="date" id="expense-date" required
                               class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                    </div>

                    <div>
                        <input type="number" id="amount" placeholder="輸入金額..." required
                               class="w-full text-2xl p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-center font-bold">
                    </div>
                    
                    <div>
                        <input type="text" id="item-name" placeholder="例如：大金冷氣、沙發訂金..." required
                               class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="category" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <!-- 選單將透過 JS 自動注入 -->
                            <option value="">載入中...</option>
                        </select>
                        <select id="area" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="不分區">🏠 不分區/全室</option>
                            <option value="玄關">🚪 玄關</option>
                            <option value="客廳">🛋️ 客廳</option>
                            <option value="主臥">🛏️ 主臥</option>
                            <option value="更衣室">👗 更衣室</option>
                            <option value="次臥">🧸 次臥</option>
                            <option value="衛浴">🛁 衛浴</option>
                            <option value="廚房餐廳">🍽️ 廚房餐廳</option>
                            <option value="陽台">🌿 陽台</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="payment-method" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="轉帳">🏦 轉帳</option>
                            <option value="刷卡">💳 刷卡</option>
                            <option value="現金">💵 現金</option>
                        </select>
                        
                        <select id="store-select" class="w-full p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm font-bold text-textMain">
                            <option value="">🛒 購買通路 (選填)</option>
                            <option value="淘寶">🛒 淘寶</option>
                            <option value="蝦皮">🍤 蝦皮</option>
                            <option value="MOMO">🩷 MOMO</option>
                            <option value="PCHOME">📦 PCHOME</option>
                            <option value="實體店面">🏬 實體店面</option>
                            <option value="其他">✨ 其他</option>
                        </select>
                    </div>

                    <div id="store-custom-div" class="hidden">
                        <input type="text" id="store-other-input" placeholder="請填寫店名或通路 (如: IKEA)..."
                               class="w-full p-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm">
                    </div>

                    <div class="flex gap-2">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="芝芝" class="peer hidden" checked>
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-sakura peer-checked:text-white transition font-bold btn-press text-sm">
                                🙋‍♀️ 芝芝
                            </div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="小T" class="peer hidden">
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-babyblue peer-checked:text-textMain transition font-bold btn-press text-sm">
                                🙋‍♂️ 小T
                            </div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="payer" value="其他" class="peer hidden">
                            <div class="p-3 rounded-2xl bg-paper peer-checked:bg-mint peer-checked:text-textMain transition font-bold btn-press text-sm">
                                👨‍👩‍👧 其他
                            </div>
                        </label>
                    </div>

                    <div id="payer-custom-div" class="hidden">
                        <input type="text" id="payer-other-input" placeholder="請填寫付款人 (如：媽媽贊助)"
                               class="w-full p-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sakura text-sm">
                    </div>

                    <div>
                        <label class="w-full p-3 border-2 border-dashed border-mint text-mint rounded-2xl font-bold flex justify-center items-center gap-2 cursor-pointer btn-press text-sm text-center bg-white">
                            <input type="file" id="photo-upload" accept="image/*" class="hidden">
                            <i class="fa-solid fa-camera"></i> 上傳商品或收據照片
                        </label>
                    </div>

                    <div id="photo-preview" class="hidden relative mt-2">
                        <img id="photo-preview-img" src="" class="w-full h-40 object-cover rounded-2xl border-2 border-mint/30 shadow-sm">
                        <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 bg-white rounded-full w-8 h-8 flex items-center justify-center text-gray-500 shadow-md">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" id="submit-btn" class="flex-1 p-4 bg-sakura text-white rounded-2xl font-bold text-lg shadow-md btn-press mt-2">
                            儲存花費
                        </button>
                        <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden flex-1 p-4 bg-gray-200 text-textMain rounded-2xl font-bold text-lg shadow-md btn-press mt-2">
                            取消修改
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <!-- ================= 2. 清單區塊 ================= -->
        <main id="page-list" class="page-section px-5 pb-10">
            <h3 class="font-bold mb-4 pl-2"><i class="fa-solid fa-list-ul text-sakura mr-2"></i>所有明細</h3>
            <div id="expense-list" class="space-y-3"></div>
        </main>

        <!-- ================= 3. 圖庫區塊 ================= -->
        <main id="page-folder" class="page-section px-5 pb-10 space-y-4">
            <h3 class="font-bold pl-2 mb-2"><i class="fa-solid fa-folder-open text-mint mr-2"></i>新家核心 PDF 檔案庫</h3>
            
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-mint/50 text-textMain flex items-center justify-center text-xl">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <p class="font-bold text-sm text-textMain">開關水電配置圖面</p>
                        <p class="text-[11px] text-gray-400">檔名: pdf/water-electric.pdf</p>
                    </div>
                </div>
                <a href="pdf/water-electric.pdf" target="_blank" class="bg-mint text-textMain px-4 py-2 rounded-xl text-xs font-bold shadow-sm btn-press">
                    <i class="fa-solid fa-file-pdf mr-1"></i>開啟
                </a>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-sakura/20 text-sakura flex items-center justify-center text-xl">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                    <div>
                        <p class="font-bold text-sm text-textMain">總裝潢工程報價單</p>
                        <p class="text-[11px] text-gray-400">檔名: pdf/quotation.pdf</p>
                    </div>
                </div>
                <a href="pdf/quotation.pdf" target="_blank" class="bg-sakura text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm btn-press">
                    <i class="fa-solid fa-file-pdf mr-1"></i>開啟
                </a>
            </div>
        </main>

        <!-- ================= 4. 統計圖表區塊 ================= -->
        <main id="page-chart" class="page-section px-5 pb-10">
            <h3 class="font-bold mb-4 pl-2"><i class="fa-solid fa-chart-pie text-sakura mr-2"></i>數據統計分析</h3>
            
            <div id="no-chart-data" class="text-center py-20 text-gray-400 text-sm bg-white rounded-3xl p-5 border border-dashed border-gray-200">
                <i class="fa-solid fa-chart-line text-5xl mb-3 text-mint/80"></i>
                <p class="font-bold text-textMain">目前尚無記帳數據唷！</p>
            </div>

            <div id="has-chart-data" class="space-y-6 hidden">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <h4 class="font-bold text-center text-textMain mb-2 text-sm bg-paper py-2 rounded-xl">分類支出佔比</h4>
                    <div class="relative w-full h-64 flex justify-center"><canvas id="chart-category"></canvas></div>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <h4 class="font-bold text-center text-textMain mb-2 text-sm bg-paper py-2 rounded-xl">區域花費佔比</h4>
                    <div class="relative w-full h-64 flex justify-center"><canvas id="chart-area"></canvas></div>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <h4 class="font-bold text-center text-textMain mb-2 text-sm bg-paper py-2 rounded-xl">成員貢獻佔比</h4>
                    <div class="relative w-full h-64 flex justify-center"><canvas id="chart-payer"></canvas></div>
                </div>
            </div>
        </main>

        <!-- ================= 5. 設定區塊 ================= -->
        <main id="page-settings" class="page-section px-5 pb-10 pt-5">
            <h3 class="font-bold mb-4 pl-2"><i class="fa-solid fa-gear text-babyblue mr-2"></i>設定</h3>
            
            <div class="bg-white p-5 rounded-3xl shadow-sm border-2 border-babyblue/30">
                <p class="text-sm font-bold mb-3">自訂記帳分類</p>
                
                <div class="flex items-center gap-2 mb-4 w-full">
                    <input type="text" id="new-category-input" placeholder="輸入新名稱..." class="flex-1 h-12 p-3 bg-paper rounded-2xl focus:outline-none focus:ring-2 focus:ring-babyblue text-sm font-bold text-textMain">
                    <button id="add-category-btn" class="h-12 bg-babyblue text-textMain px-4 rounded-2xl font-bold shadow-sm btn-press flex items-center justify-center gap-1 shrink-0 text-sm">
                        <i class="fa-solid fa-plus"></i> 新增
                    </button>
                </div>

                <div id="category-settings-list" class="space-y-2"></div>
            </div>
        </main>

        <!-- ================= 底部導覽列 ================= -->
        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 pb-safe pt-2 px-1 flex justify-around items-center text-[10px] shadow-[0_-10px_20px_rgba(0,0,0,0.03)] rounded-t-3xl z-20">
            <button id="nav-home" class="nav-btn w-1/5 flex flex-col items-center p-2 text-sakura font-bold transition-colors">
                <i class="fa-solid fa-house text-lg mb-1"></i>首頁
            </button>
            <button id="nav-list" class="nav-btn w-1/5 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-list-check text-lg mb-1"></i>明細
            </button>
            <button id="nav-folder" class="nav-btn w-1/5 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-folder-open text-lg mb-1"></i>圖庫
            </button>
            <button id="nav-chart" class="nav-btn w-1/5 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-chart-pie text-lg mb-1"></i>統計
            </button>
            <button id="nav-settings" class="nav-btn w-1/5 flex flex-col items-center p-2 text-gray-400 transition-colors">
                <i class="fa-solid fa-gear text-lg mb-1"></i>設定
            </button>
        </nav>

    </div>

    <!-- 互動邏輯與 Firebase 連線 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDM1zCt1NyVtNnkmCT6i5dXy32nWl5mhWM",
          authDomain: "new-house-24ecb.firebaseapp.com",
          projectId: "new-house-24ecb",
          storageBucket: "new-house-24ecb.firebasestorage.app",
          messagingSenderId: "212198350832",
          appId: "1:212198350832:web:722951ad61a042802b8735",
          measurementId: "G-CRPMKV6RZG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let editingId = null;
        document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];

        const form = document.getElementById('expense-form');
        const listContainer = document.getElementById('expense-list');
        const totalEl = document.getElementById('total-amount');
        const chichiPaidEl = document.getElementById('chichi-paid');
        const littletPaidEl = document.getElementById('littlet-paid');

        const formatMoney = (num) => new Intl.NumberFormat('zh-TW').format(num || 0);

        // --- 頁籤切換邏輯 ---
        const tabs = [
            { btn: document.getElementById('nav-home'), page: document.getElementById('page-home') },
            { btn: document.getElementById('nav-list'), page: document.getElementById('page-list') },
            { btn: document.getElementById('nav-folder'), page: document.getElementById('page-folder') },
            { btn: document.getElementById('nav-chart'), page: document.getElementById('page-chart') },
            { btn: document.getElementById('nav-settings'), page: document.getElementById('page-settings') }
        ];

        tabs.forEach(tab => {
            tab.btn.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.page.classList.remove('active');
                    t.btn.classList.remove('text-sakura', 'font-bold');
                    t.btn.classList.add('text-gray-400');
                });
                tab.page.classList.add('active');
                tab.btn.classList.remove('text-gray-400');
                tab.btn.classList.add('text-sakura', 'font-bold');
                window.scrollTo(0, 0);
            });
        });

        // --- 表單欄位連動控制 ---
        const payerRadios = document.querySelectorAll('input[name="payer"]');
        const payerCustomDiv = document.getElementById('payer-custom-div');
        payerRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === '其他') payerCustomDiv.classList.remove('hidden');
                else payerCustomDiv.classList.add('hidden');
            });
        });

        const storeSelect = document.getElementById('store-select');
        const storeCustomDiv = document.getElementById('store-custom-div');
        storeSelect.addEventListener('change', (e) => {
            if (e.target.value === '實體店面' || e.target.value === '其他') storeCustomDiv.classList.remove('hidden');
            else storeCustomDiv.classList.add('hidden');
        });

        // --- ✨ 自訂分類邏輯 (自動救援升級版) ---
        const categoryDocRef = doc(db, "settings", "appCategories");
        const defaultCategories = ["設計師裝潢費用", "家電", "軟裝", "裝飾類", "其他"];

        async function initCategories() {
            try {
                const docSnap = await getDoc(categoryDocRef);
                // 防呆升級：如果找不到檔案，或是檔案裡面的分類「被刪光光(長度為0)」了，就強制幫你長出預設分類！
                if (!docSnap.exists() || !docSnap.data().list || docSnap.data().list.length === 0) {
                    await setDoc(categoryDocRef, { list: defaultCategories }, { merge: true });
                }
            } catch (e) { console.error("分類初始化失敗", e); }
        }
        initCategories();

        onSnapshot(categoryDocRef, (docSnap) => {
            let cats = defaultCategories; // 先準備好備用方案
            
            if (docSnap.exists() && docSnap.data().list && docSnap.data().list.length > 0) {
                cats = docSnap.data().list; // 如果資料庫有東西，就用資料庫的
            } else {
                // 如果抓下來發現是空的，立刻觸發救援寫回資料庫
                setDoc(categoryDocRef, { list: defaultCategories }, { merge: true });
            }

            // 畫出選單
            const catSelect = document.getElementById('category');
            catSelect.innerHTML = cats.map(c => `<option value="${c}">📌 ${c}</option>`).join('');

            // 畫出設定頁的清單
            const catSetList = document.getElementById('category-settings-list');
            catSetList.innerHTML = cats.map(c => `
                <div class="flex justify-between items-center bg-paper p-3 rounded-2xl text-sm font-bold border border-gray-100 shadow-sm">
                    <span>${c}</span>
                    <button onclick="deleteCategory('${c}')" class="text-red-400 p-2 btn-press bg-white rounded-xl shadow-sm">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        });

        document.getElementById('add-category-btn').addEventListener('click', async () => {
            const input = document.getElementById('new-category-input');
            const val = input.value.trim();
            if (!val) { alert("請先輸入分類名稱喔！"); return; }
            const btn = document.getElementById('add-category-btn');
            try {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;
                await setDoc(categoryDocRef, { list: arrayUnion(val) }, { merge: true });
                input.value = '';
            } catch (e) { alert("新增失敗：" + e.message); } 
            finally { btn.innerHTML = '<i class="fa-solid fa-plus"></i> 新增'; btn.disabled = false; }
        });

        window.deleteCategory = async function(cat) {
            if(confirm(`確定要刪除「${cat}」嗎？`)) {
                try { await setDoc(categoryDocRef, { list: arrayRemove(cat) }, { merge: true }); } catch (e) { console.error(e); }
            }
        }

        // --- 照片壓縮處理 ---
        let currentPhotoBase64 = null;
        const photoInput = document.getElementById('photo-upload');
        const photoPreview = document.getElementById('photo-preview');
        const photoPreviewImg = document.getElementById('photo-preview-img');

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; 
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height = height * (MAX_WIDTH / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6); 
                    photoPreviewImg.src = currentPhotoBase64;
                    photoPreview.classList.remove('hidden');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        window.removePhoto = function() {
            currentPhotoBase64 = null; photoInput.value = ''; photoPreview.classList.add('hidden');
        }

        // --- 圖表繪製 ---
        let chartInstances = {};
        function renderChart(canvasId, dataMap) {
            if (typeof Chart === 'undefined') { return; }
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const labels = Object.keys(dataMap);
            const data = Object.values(dataMap);
            const bgColors = ['#FFB7B2', '#B5EAD7', '#E2F0CB', '#FFD8B1', '#C5CAE9', '#F8BBD0', '#B2DFDB', '#FFF9C4', '#D1C4E9', '#FFCC80'];

            if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }

            chartInstances[canvasId] = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: bgColors, borderWidth: 2, borderColor: '#fff' }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: '"Zen Maru Gothic"' } } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || ''; let value = context.parsed || 0;
                                    let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    let percentage = Math.round((value / total) * 100) + '%';
                                    return ` ${label}: $${new Intl.NumberFormat('zh-TW').format(value)} (${percentage})`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- 全域：修改與刪除功能 ---
        window.startEdit = async function(id) {
            try {
                const docSnap = await getDoc(doc(db, "expenses", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    editingId = id;

                    document.getElementById('amount').value = data.amount;
                    document.getElementById('item-name').value = data.name;
                    document.getElementById('category').value = data.category || '';
                    document.getElementById('area').value = data.area || '不分區';
                    document.getElementById('payment-method').value = data.paymentMethod || '轉帳';
                    document.getElementById('expense-date').value = data.fullDate || new Date().toISOString().split('T')[0];

                    const storeVal = data.store || '';
                    if (['淘寶', '蝦皮', 'MOMO', 'PCHOME', ''].includes(storeVal)) {
                        storeSelect.value = storeVal; storeCustomDiv.classList.add('hidden');
                    } else {
                        storeSelect.value = '其他';
                        document.getElementById('store-other-input').value = storeVal;
                        storeCustomDiv.classList.remove('hidden');
                    }

                    const payerVal = data.payer || '芝芝';
                    if (['芝芝', '小T'].includes(payerVal)) {
                        document.querySelector(`input[name="payer"][value="${payerVal}"]`).checked = true;
                        payerCustomDiv.classList.add('hidden');
                    } else {
                        document.querySelector('input[name="payer"][value="其他"]').checked = true;
                        document.getElementById('payer-other-input').value = payerVal;
                        payerCustomDiv.classList.remove('hidden');
                    }

                    if (data.photo) {
                        currentPhotoBase64 = data.photo; photoPreviewImg.src = data.photo; photoPreview.classList.remove('hidden');
                    } else { removePhoto(); }

                    const submitBtn = document.getElementById('submit-btn');
                    submitBtn.innerText = '💾 更新這筆花費';
                    submitBtn.classList.remove('bg-sakura'); submitBtn.classList.add('bg-orange-400');
                    document.getElementById('cancel-edit-btn').classList.remove('hidden');

                    document.getElementById('nav-home').click();
                }
            } catch (e) { alert("讀取花費失敗：" + e.message); }
        };

        window.cancelEdit = function() {
            editingId = null; form.reset(); removePhoto();
            document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
            payerCustomDiv.classList.add('hidden'); storeCustomDiv.classList.add('hidden');
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = '儲存花費'; submitBtn.disabled = false;
            submitBtn.classList.remove('bg-orange-400'); submitBtn.classList.add('bg-sakura');
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        };

        window.deleteExpense = async function(id, name) {
            if (confirm(`確定要刪除「${name}」這筆帳目嗎？`)) {
                try { await deleteDoc(doc(db, "expenses", id)); } catch (e) { alert("刪除失敗：" + e.message); }
            }
        };

        // --- 核心：即時同步監聽明細與圖表 ---
        const expensesRef = collection(db, "expenses");
        const q = query(expensesRef, orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            listContainer.innerHTML = '';
            let total = 0; let chichiTotal = 0; let littletTotal = 0;
            let categoryData = {}; let areaData = {}; let payerData = {};

            snapshot.forEach((docSnap) => {
                const exp = docSnap.data();
                const docId = docSnap.id;
                
                const amt = parseInt(exp.amount) || 0;
                total += amt;
                
                const payerStr = exp.payer || '未知';
                if(payerStr === '芝芝') chichiTotal += amt;
                else if(payerStr === '小T') littletTotal += amt;
                
                categoryData[exp.category || '未分類'] = (categoryData[exp.category || '未分類'] || 0) + amt;
                areaData[exp.area || '不分區'] = (areaData[exp.area || '不分區'] || 0) + amt;
                payerData[payerStr] = (payerData[payerStr] || 0) + amt;

                const areaTag = exp.area && exp.area !== '不分區' ? `<span class="bg-babyblue/50 text-textMain px-2 py-0.5 rounded-full">${exp.area}</span>` : '';
                const storeTag = exp.store ? `<span class="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full"><i class="fa-solid fa-cart-shopping mr-1"></i>${exp.store}</span>` : '';
                const photoHtml = exp.photo ? `<img src="${exp.photo}" class="mt-2 w-full h-32 object-cover rounded-xl border">` : '';
                
                let avatarColor = 'bg-mint text-textMain'; let avatarChar = payerStr.charAt(0);
                if (payerStr === '芝芝') { avatarColor = 'bg-sakura text-white'; avatarChar = '芝'; }
                else if (payerStr === '小T') { avatarColor = 'bg-babyblue text-textMain'; avatarChar = 'T'; }

                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-2xl shadow-sm border border-gray-50';
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 flex-shrink-0 rounded-full flex items-center justify-center font-bold text-sm ${avatarColor}">
                                ${avatarChar}
                            </div>
                            <div>
                                <p class="font-bold text-textMain">${exp.name}</p>
                                <div class="text-xs text-gray-400 mt-1 flex flex-wrap gap-1 items-center">
                                    <span>${exp.date || '無日期'}</span>
                                    <span class="bg-mint/50 text-textMain px-2 py-0.5 rounded-full">${exp.category || '未分類'}</span>
                                    ${areaTag}
                                    ${storeTag}
                                </div>
                            </div>
                        </div>
                        <div class="font-bold text-lg text-sakura">$${formatMoney(amt)}</div>
                    </div>
                    ${photoHtml}
                    <div class="flex justify-end gap-2 mt-3 pt-2 border-t border-gray-100">
                        <button onclick="startEdit('${docId}')" class="text-xs bg-gray-50 text-gray-500 px-3 py-1.5 rounded-xl border border-gray-100 font-bold btn-press"><i class="fa-solid fa-pen-to-square mr-1"></i>修改</button>
                        <button onclick="deleteExpense('${docId}', '${exp.name}')" class="text-xs bg-red-50 text-red-400 px-3 py-1.5 rounded-xl border border-red-100 font-bold btn-press"><i class="fa-solid fa-trash-can mr-1"></i>刪除</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            totalEl.innerText = formatMoney(total);
            chichiPaidEl.innerText = `$${formatMoney(chichiTotal)}`;
            littletPaidEl.innerText = `$${formatMoney(littletTotal)}`;

            if (total === 0) {
                document.getElementById('no-chart-data').classList.remove('hidden');
                document.getElementById('has-chart-data').classList.add('hidden');
            } else {
                document.getElementById('no-chart-data').classList.add('hidden');
                document.getElementById('has-chart-data').classList.remove('hidden');
                try {
                    renderChart('chart-category', categoryData);
                    renderChart('chart-area', areaData);
                    renderChart('chart-payer', payerData);
                } catch(err) { console.error(err); }
            }
        });

        // --- 儲存表單控制 ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = parseInt(document.getElementById('amount').value);
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('category').value;
            const area = document.getElementById('area').value; 
            const paymentMethod = document.getElementById('payment-method').value;
            
            const fullDate = document.getElementById('expense-date').value;
            const dateParts = fullDate.split('-');
            const dateStr = `${parseInt(dateParts[1])}/${parseInt(dateParts[2])}`;

            let payer = document.querySelector('input[name="payer"]:checked').value;
            if (payer === '其他') {
                const customPayer = document.getElementById('payer-other-input').value.trim();
                payer = customPayer !== '' ? customPayer : '其他成員';
            }

            let store = document.getElementById('store-select').value;
            if (store === '實體店面' || store === '其他') {
                const customStore = document.getElementById('store-other-input').value.trim();
                store = customStore !== '' ? customStore : store;
            }

            try {
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.innerText = '處理中...'; submitBtn.disabled = true;

                const expenseData = {
                    amount, name, payer, category, area, paymentMethod, store,
                    photo: currentPhotoBase64, date: dateStr, fullDate: fullDate, timestamp: new Date()
                };

                if (editingId) {
                    await setDoc(doc(db, "expenses", editingId), expenseData, { merge: true }); cancelEdit();
                } else {
                    await addDoc(collection(db, "expenses"), expenseData);
                    form.reset(); removePhoto();
                    document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
                }
                document.getElementById('nav-list').click();
            } catch (e) { alert("操作失敗！原因：\n" + e.message); } 
            finally {
                const submitBtn = document.getElementById('submit-btn');
                if(!editingId) { submitBtn.innerText = '儲存花費'; submitBtn.disabled = false; }
            }
        });
    </script>
</body>
</html>
